name: CMake

on:
  pull_request:
    branches: [main, "feature/**", "release/**"]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  PRESET: linux_release
  BUILD_DIR: ${{github.workspace}}/build/${PRESET}
  BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
  HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}

jobs:
  ################################
  # Run Linter against code base #
  ################################
  lint:
    # Name the Job
    name: Lint Code Base
    # Set the agent to run on
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0

      - name: Lint All
        uses: super-linter/super-linter/slim@v8.5.0
        env:
          VALIDATE_ALL_CODEBASE: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LINTER_RULES_PATH: .
          VALIDATE_CLANG_FORMAT: true


  build:
    # The CMake configure and build commands are platform agnostic and should work equally
    # well on Windows or Mac.  You can convert this to a matrix build if you need
    # cross-platform coverage.
    # See: https://docs.github.com/en/free-pro-team@latest/actions/learn-github-actions/managing-complex-workflows#using-a-build-matrix
    runs-on: ubuntu-latest
    outputs:
      targets_to_test: ${{ steps.find_modified_targets.outputs.modified_targets }}
    env:
      CC: clang
      CXX: clang++
      CI: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # <-- This forces Git to download all commits and history

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install Python dependencies (optional)
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Configure cmake query API
        run: |
          mkdir -p ${{env.BUILD_DIR}}/.cmake/api/v1/query
          touch ${{env.BUILD_DIR}}/.cmake/api/v1/query/codemodel-v2
          find ${{env.BUILD_DIR}} -iname "codemodel-v2"

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        run: cmake --preset ${{env.PRESET}}

      - name: Build
        # Build your program with the given configuration
        run: |
          cmake --version
          cmake --build ${{env.BUILD_DIR}} --parallel
          clang-tidy -p ${{env.BUILD_DIR}} ${{env.BUILD_DIR}}/tmp_lcnsAlgebra_main.cpp
          clang-tidy -p ${{env.BUILD_DIR}} ${{env.BUILD_DIR}}/tmp_lcnsCombinatorics_main.cpp

      - name: Targets modified in this pull request
        id: find_modified_targets
        run: |
          python Scripts/modified-targets.py ${{env.BUILD_DIR}} "origin/$BASE_BRANCH" "origin/$HEAD_BRANCH"

      - name: Upload build directory to artefact
        uses: actions/upload-artifact@v4
        with:
          name: build_directory
          path: |
            ${{github.workspace}}/build

  tests:
    runs-on: ubuntu-latest
    needs: build
    env:
      TEST_DIRECTORIES: "algebra/tests, algebra/benchmarks, combinatorics/tests"

    steps:
      - name: Download build directory
        uses: actions/download-artifact@v4
        with:
          name: build_directory
          path: build

      - name: Update mode for executables
        run: |
          chmod +x ${{env.BUILD_DIR}}/algebra/tests/testVector
          chmod +x ${{env.BUILD_DIR}}/algebra/tests/testMatrix
          chmod +x ${{env.BUILD_DIR}}/algebra/tests/testQuaternion
          chmod +x ${{env.BUILD_DIR}}/algebra/tests/testMapping
          chmod +x ${{env.BUILD_DIR}}/algebra/tests/testMultiplicationLarge
          chmod +x ${{env.BUILD_DIR}}/algebra/benchmarks/benchmarkMultiplicationLarge
          chmod +x ${{env.BUILD_DIR}}/combinatorics/tests/testCombinatorics

      - name: Check CPU
        run: grep -o 'avx[^ ]*' /proc/cpuinfo

      - name: Run tests for targets modified in this pull request
        run: |
          IFS=',' read -ra test_directories <<< "$TEST_DIRECTORIES"
          for test_dir in "${test_directories[@]}"; do
            ctest -C ${{env.BUILD_TYPE}} --test-dir ${{env.BUILD_DIR}}/${test_dir} --output-on-failure -VV --parallel -L "${{ needs.build.outputs.targets_to_test }}"
          done

      - name: Run the other tests
        run: |
          IFS=',' read -ra test_directories <<< "$TEST_DIRECTORIES"
          for test_dir in "${test_directories[@]}"; do
            ctest -C ${{env.BUILD_TYPE}} --test-dir ${{env.BUILD_DIR}}/${test_dir} --output-on-failure -VV --parallel -LE "${{ needs.build.outputs.targets_to_test }}"
          done

      - name: Clean build directory artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: build_directory

